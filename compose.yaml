services:
  benchy:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      replicas: 1
    expose:
      - "3000"
    environment:
      SERVICE_URL_BENCHY_3000: /
      DISCORD_TOKEN: ${DISCORD_TOKEN:?}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?}
      DISCORD_RELEASES_CHANNEL_ID: ${DISCORD_RELEASES_CHANNEL_ID:?}
      DISCORD_RELEASE_PINGS_ROLE_ID: ${DISCORD_RELEASE_PINGS_ROLE_ID:?}
      DISCORD_GITHUB_PULL_CHANNEL_ID: ${DISCORD_GITHUB_PULL_CHANNEL_ID:?}
      DISCORD_GITHUB_PULL_ROLE_ID: ${DISCORD_GITHUB_PULL_ROLE_ID:?}
      DISCORD_GITHUB_ISSUE_CHANNEL_ID: ${DISCORD_GITHUB_ISSUE_CHANNEL_ID:?}
      DISCORD_GITHUB_ISSUE_ROLE_ID: ${DISCORD_GITHUB_ISSUE_ROLE_ID:?}
      DISCORD_SUPPORT_FORUM_ID: ${DISCORD_SUPPORT_FORUM_ID:?}
      DISCORD_SUPPORT_SOURCE_IDS: ${DISCORD_SUPPORT_SOURCE_IDS:?}
      DISCORD_MOD_LOG_CHANNEL_ID: ${DISCORD_MOD_LOG_CHANNEL_ID:?}
      DISCORD_MODERATOR_ROLE_IDS: ${DISCORD_MODERATOR_ROLE_IDS:?}
      DISCORD_WELCOME_CHANNEL_ID: ${DISCORD_WELCOME_CHANNEL_ID:?}
      DISCORD_RULES_CHANNEL_ID: ${DISCORD_RULES_CHANNEL_ID:?}
      DISCORD_CONTRIBUTOR_ROLE_ID: ${DISCORD_CONTRIBUTOR_ROLE_ID:-}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_OAUTH_CLIENT_SECRET:-}
      BENCHY_PUBLIC_URL: ${BENCHY_PUBLIC_URL:-${SERVICE_URL_BENCHY_3000:-}}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-PrintBench/printbench}
    volumes:
      - benchy-data:/data

volumes:
  benchy-data:
